<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.2/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.2/core.js">
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Calculator</h1>

        <p>Enter two numbers</p>

        <label for="num1">First Number:</label>
        <input type="number" id="num1" class="form-control">

        <br>

        <label for="num2">Second Number:</label>
        <input type="number" id="num2" class="form-control">

        <br>

        <button py-click="compute" class="btn btn-primary">
            COMPUTE
        </button>

        <br><br>

        <div id="result" class="alert alert-info">
            Results will appear here.
        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>

</html>
